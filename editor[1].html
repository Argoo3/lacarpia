<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifica il sito</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#eee9dd;
  }
  .bar{
    position:sticky;
    top:0;
    z-index:10;
    background:#211e19;
    color:#ece6d8;
    padding:14px 16px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .bar h1{
    font-size:15px;
    font-weight:600;
    margin:0;
    flex:1 1 100%;
  }
  .bar p{
    font-size:13px;
    color:#c9c1ae;
    margin:0 0 6px 0;
    flex:1 1 100%;
    line-height:1.5;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:10px 16px;
    border-radius:6px;
    border:none;
    cursor:pointer;
  }
  .btn-save{background:#7c8570; color:#fff;}
  .btn-reset{background:#332e26; color:#ece6d8;}
  .status{
    font-size:13px;
    color:#b08d4f;
    margin-left:auto;
  }
  iframe{
    display:block;
    width:100%;
    height:calc(100svh - 130px);
    border:none;
  }
  @media (max-width:600px){
    iframe{height:calc(100svh - 170px);}
  }
</style>
</head>
<body>

<div class="bar">
  <h1>✏️ Modifica il sito</h1>
  <p>Tocca un testo qui sotto per scriverci sopra. Quando hai finito, premi "Scarica il sito aggiornato" e carica il file su GitHub come al solito.</p>
  <button class="btn-save" id="saveBtn">⬇ Scarica il sito aggiornato</button>
  <button class="btn-reset" id="resetBtn">↺ Annulla tutte le modifiche</button>
  <span class="status" id="status"></span>
</div>

<iframe id="siteFrame" src="index.html"></iframe>

<script>
  const frame = document.getElementById('siteFrame');
  const statusEl = document.getElementById('status');

  function makeEditable() {
    const doc = frame.contentDocument;
    if (!doc) return;

    // stile per evidenziare le zone modificabili
    const style = doc.createElement('style');
    style.textContent = `
      [data-editable="true"] {
        outline: 2px dashed transparent;
        outline-offset: 4px;
        border-radius: 2px;
        transition: outline-color 0.15s;
        cursor: text;
      }
      [data-editable="true"]:hover {
        outline-color: rgba(176,141,79,0.6);
      }
      [data-editable="true"]:focus {
        outline: 2px solid #c25b3f;
        outline-color: #c25b3f;
        background: rgba(194,91,63,0.08);
      }
    `;
    doc.head.appendChild(style);

    doc.querySelectorAll('[data-editable="true"]').forEach(el => {
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('input', () => {
        statusEl.textContent = 'Modifiche non ancora scaricate';
      });
    });
  }

  frame.addEventListener('load', makeEditable);

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Vuoi annullare tutte le modifiche fatte finora in questa pagina e ricominciare dal sito online?')) {
      frame.src = 'index.html?t=' + Date.now();
      statusEl.textContent = '';
    }
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const doc = frame.contentDocument;
    if (!doc) return;

    // clona il documento per pulirlo prima di scaricarlo
    const clone = doc.documentElement.cloneNode(true);
    clone.querySelectorAll('[data-editable="true"]').forEach(el => {
      el.removeAttribute('contenteditable');
    });
    const styleTag = clone.querySelector('style:last-of-type');
    // rimuove lo stile aggiunto dall'editor (l'ultimo <style> nel <head>)
    const styles = clone.querySelectorAll('head style');
    if (styles.length) {
      const last = styles[styles.length - 1];
      if (last.textContent.includes('data-editable')) last.remove();
    }

    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    statusEl.textContent = 'Scaricato ✓ — ora caricalo su GitHub';
  });
</script>

</body>
</html>
